name: ci

on:
  push:
    branches:
      - main
      - docs/musca-foundations
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-314:
    name: Windows / Python 3.14.6
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Show interpreter
        run: python --version

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Validate registered manifest schemas
        run: >-
          python scripts/validate_manifests.py --level schema
          data/manifests/SCI-DATA-SHIU-FW630.candidate.json
          experiments/manifests/SCI-R00-SHIU-ENV-DATA.candidate.json
          experiments/manifests/SCI-R01-SHIU-SUGAR.candidate.json
          experiments/manifests/gate-p01.json

      - name: Assess SCI-R00 preflight remains approval-gated
        run: python scripts/research_r00_preflight.py --repo-root . --require-blocker governance

      - name: Compile sources
        run: python -m compileall -q musca scripts tests

      - name: Smoke deterministic demo
        run: python -m musca --demo --mode light_chemical --json
