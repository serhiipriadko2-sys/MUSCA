name: ci

on:
  push:
    branches:
      - main
      - docs/musca-foundations
      - 'feature/**'
  pull_request:
    branches:
      - main
      - docs/musca-foundations
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-314:
    name: Windows / Python 3.14.6
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14.6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Show interpreter
        run: python --version

      - name: Check Tk capability
        run: python -c "import tkinter as tk; print('Tk', tk.TkVersion)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Validate registered manifest schemas
        run: >-
          python scripts/validate_manifests.py --level schema
          data/manifests/SCI-DATA-SHIU-FW630.candidate.json
          experiments/manifests/SCI-R00-SHIU-ENV-DATA.candidate.json
          experiments/manifests/SCI-R01-SHIU-SUGAR.candidate.json
          experiments/manifests/SCI-R01-SHIU-SUGAR.run.json
          experiments/manifests/SCI-R02-SHIU-MN9-LATERALITY-200HZ.candidate.json
          experiments/manifests/SCI-R02-SHIU-MN9-LATERALITY-200HZ.run.json
          experiments/manifests/gate-p01.json

      - name: Assess SCI-R00 preflight remains solver-gated
        run: python scripts/research_r00_preflight.py --repo-root . --require-blocker host_solver

      - name: Compile sources
        run: python -m compileall -q musca scripts tests

      - name: Compile Blender Form tooling
        run: >-
          python -m py_compile
          blender/gate-lab-v0.2/scripts/build_gate_lab_form.py
          blender/gate-lab-v0.2/scripts/validate_gate_lab_form.py
          scripts/validate_blender_form.py

      - name: Verify checked-in Blender Form artifact integrity
        run: python scripts/validate_blender_form.py

      - name: Verify pilot bundle tooling
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'gate-p01-ci.zip'
          python scripts/pilot_bundle.py freeze --output $bundle
          python scripts/pilot_bundle.py verify $bundle

      - name: Smoke deterministic demo
        run: python -m musca --demo --mode light_chemical --json


  browser-3d-function:
    name: Browser 3D Function / Node 24.18.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: prototype3d/package-lock.json

      - name: Install pinned browser prototype dependency
        working-directory: prototype3d
        run: npm ci

      - name: Audit runtime dependency
        working-directory: prototype3d
        run: npm audit --omit=dev --audit-level=high

      - name: Run browser 3D state tests
        working-directory: prototype3d
        run: npm test

      - name: Check pinned Three.js server surface
        working-directory: prototype3d
        run: npm run check

      - name: Validate room Function evidence
        working-directory: prototype3d
        run: npm run validate:room

      - name: Check Unity source boundary
        shell: pwsh
        run: |
          $required = @(
            'unity/MUSCA-Gate3D/ProjectSettings/ProjectVersion.txt',
            'unity/MUSCA-Gate3D/Assets/MUSCA/Scenes/GateLab.unity',
            'unity/MUSCA-Gate3D/Docs/AI/UnitySceneValidation.json'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing Unity source/evidence: $path" } }
          $forbidden = git ls-files 'unity/MUSCA-Gate3D/Library/**' 'unity/MUSCA-Gate3D/Temp/**' 'unity/MUSCA-Gate3D/Builds/**'
          if ($forbidden) { throw "Generated Unity state is tracked: $forbidden" }
          Get-Content 'unity/MUSCA-Gate3D/ProjectSettings/ProjectVersion.txt'
