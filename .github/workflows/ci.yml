name: ci

on:
  push:
    branches:
      - main
      - docs/musca-foundations
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-314:
    name: Windows / Python 3.14.6
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Show interpreter
        run: python --version

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Compile sources
        run: python -m compileall -q musca scripts tests

      - name: Smoke deterministic demo
        run: python -m musca --demo --mode light_chemical --json
